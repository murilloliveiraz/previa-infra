# PrevIA - nginx como proxy reverso para o Gunicorn
# Template: {{VAR}} e substituido pelo 02-app-provision.sh
server {
    listen 80 default_server;
    server_name {{APP_HOSTNAMES}} {{PREVIA_HOSTNAME}}.{{PREVIA_DOMAIN}} _;

    access_log /var/log/nginx/previa-access.log;
    error_log  /var/log/nginx/previa-error.log;

    client_max_body_size 10m;

    location /static/ {
        alias {{APP_DIR}}/app/static/;
        expires 1h;
    }

    location / {
        proxy_pass         http://127.0.0.1:{{APP_PORT}};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
